spring:
  application:
    name: ${SPRING_APP_NAME:radio-registry}
  profiles:
    active: ${PROFILE_ACTIVE:default}
  datasource:
    url: ${DB_URL}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        default_schema: ${HIBERNATE_DEFAULT_SCHEMA:radio_registry}
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:20}
    show-sql: ${JPA_SHOW_SQL:true}
  data:
    web:
      pageable:
        default-page-size: ${DEFAULT_PAGE_SIZE:20}
        max-page-size: ${MAX_PAGE_SIZE:100}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
        max.in.flight.requests.per.connection: ${KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS:5}
        retries: ${KAFKA_PRODUCER_RETRIES:3}
    template:
      observation-enabled: true

kafka:
  outboxevent:
    publisher:
      fixed:
        delay: ${KAFKA_OUTBOXEVENT_PUBLISHER_FIXED_DELAY:5000}
      max:
        retries: ${KAFKA_OUTBOXEVENT_PUBLISHER_MAX_RETRIES:3}
    cleanup:
      retention:
        days: ${KAFKA_OUTBOXEVENT_CLEANUP_RETENTION_DAYS:90}
      cron: ${KAFKA_OUTBOXEVENT_CLEANUP_CRON:0 0 3 * * *}

#  security:
#    user:
#      name: ${SECURITY_USERNAME}
#      password: ${SECURITY_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900} # 15 minutes
  refresh-token:
    expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800} # 7 days
  refreshtoken:
    cleanup:
      retention:
        days: ${JWT_REFRESHTOKEN_CLEANUP_RETENTION_DAYS:90}
      cron: ${JWT_REFRESHTOKEN_CLEANUP_CRON:0 0 5 * * *}

management:
  endpoints:
    web:
      exposure:
        include: ${EXPOSURE_INCLUDE}
  endpoint:
    health:
      show-details: ${SHOW_DETAILS}
  metrics:
    tags:
      application: ${SPRING_APP_NAME:radio-registry}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_ENDPOINT}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACES_ENDPOINT}

logging:
#  pattern:
#    console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
  level:
    org:
      springframework:
        security: ${SPRING_SECURITY_LOG_LEVEL:TRACE}
  structured:
    format:
      console: logstash

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}